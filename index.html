<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>SMI Pro - Fullscreen WHO Charts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; } 
        .loader { border-top-color: #3b82f6; -webkit-animation: spinner 1s linear infinite; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .badge { padding: 0.35rem 0.6rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 700; display: inline-block; white-space: nowrap;}
        .badge-normal { background-color: #dcfce7; color: #166534; }
        .badge-warning { background-color: #fef08a; color: #854d0e; }
        .badge-danger { background-color: #fee2e2; color: #991b1b; }
        .badge-severe { background-color: #dc2626; color: #ffffff; }
        .badge-pending { background-color: #e2e8f0; color: #475569; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
    </style>
    <!-- දත්ත ගොනුව -->
    <script src="who_data.js"></script>
</head>
<body class="text-slate-800 pb-20">

    <header class="glass-header sticky top-0 z-40 p-4 shadow-sm flex items-center justify-center">
        <h1 class="text-xl font-extrabold text-slate-800 tracking-tight">SMI <span class="text-blue-600">PRO</span></h1>
    </header>

    <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6 mt-2">
        <!-- Settings & Upload Section (කලින් විදිහටමයි) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">1. සැකසුම්</h2>
                <div class="space-y-4">
                    <input type="password" id="api-key" placeholder="Enter Gemini Key" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-base">
                    <select id="gender" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-base font-medium">
                        <option value="boys">👦 පිරිමි ළමුන් (Boys)</option>
                        <option value="girls">👧 ගැහැණු ළමුන් (Girls)</option>
                    </select>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">2. දත්ත ඇතුලත් කිරීම</h2>
                <label for="image-upload" class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-300 border-dashed rounded-xl cursor-pointer bg-slate-50 hover:bg-blue-50 transition-colors">
                    <p class="text-base font-bold text-slate-700">📸 Tap to Scan Sheet</p>
                    <input id="image-upload" type="file" accept="image/*" capture="environment" class="hidden" onchange="previewAndCompressImage(event)" />
                </label>
                <div id="preview-container" class="hidden mt-3 text-center">
                    <img id="image-preview" class="max-h-32 mx-auto rounded-xl shadow-sm border border-slate-200 object-contain" src="" alt="Preview">
                </div>
                <button id="analyze-btn" onclick="processImageWithGemini()" class="mt-4 w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md active:bg-blue-700 transition-all text-lg">
                    Analyze Data ✨
                </button>
                <div id="loading" class="hidden mt-3 flex justify-center items-center space-x-3 bg-blue-50 p-3 rounded-xl text-sm">
                    <div class="loader rounded-full border-4 border-t-4 border-blue-400 h-5 w-5"></div>
                    <span class="text-blue-700 font-semibold">Processing...</span>
                </div>
            </div>
        </div>

        <!-- 📊 WHO Actual Growth Charts Section (අලුත් Fullscreen පහසුකම) -->
        <div id="analytics-section" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 md:mb-0">3. ප්‍රස්ථාර (WHO Curves)</h2>
                <select id="student-filter" onchange="updateCharts()" class="w-full md:w-1/2 p-3 bg-blue-50 border border-blue-200 text-blue-800 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-bold">
                    <option value="ALL">📊 සියලුම ළමුන් (All Students)</option>
                </select>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <!-- BMI Chart Container -->
                <div id="bmi-chart-container" class="border border-slate-100 p-4 rounded-xl bg-slate-50 relative transition-all duration-300 flex flex-col">
                    <!-- Expand Button -->
                    <button onclick="toggleFullScreen('bmi-chart-container', bmiChartInstance)" class="absolute top-2 right-2 bg-white border border-slate-200 p-2 rounded-lg shadow-sm hover:bg-blue-50 z-10 text-blue-600 font-bold text-xs flex items-center gap-1" id="bmi-btn-expand">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg> Fullscreen
                    </button>
                    <!-- Close Button (Hidden initially) -->
                    <button onclick="toggleFullScreen('bmi-chart-container', bmiChartInstance)" class="hidden absolute top-4 right-4 bg-red-100 border border-red-200 p-3 rounded-lg shadow-md hover:bg-red-200 z-10 text-red-700 font-bold flex items-center gap-1" id="bmi-btn-close">
                        ✖ Close
                    </button>
                    
                    <h4 class="text-center font-bold text-slate-700 mb-2 text-sm title-text">BMI-for-Age (WHO Standard)</h4>
                    <div class="relative w-full aspect-[4/3] md:aspect-auto flex-grow chart-wrapper">
                        <canvas id="whoBmiChart"></canvas>
                    </div>
                </div>

                <!-- HFA Chart Container -->
                <div id="hfa-chart-container" class="border border-slate-100 p-4 rounded-xl bg-slate-50 relative transition-all duration-300 flex flex-col">
                    <!-- Expand Button -->
                    <button onclick="toggleFullScreen('hfa-chart-container', hfaChartInstance)" class="absolute top-2 right-2 bg-white border border-slate-200 p-2 rounded-lg shadow-sm hover:bg-blue-50 z-10 text-blue-600 font-bold text-xs flex items-center gap-1" id="hfa-btn-expand">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg> Fullscreen
                    </button>
                    <!-- Close Button -->
                    <button onclick="toggleFullScreen('hfa-chart-container', hfaChartInstance)" class="hidden absolute top-4 right-4 bg-red-100 border border-red-200 p-3 rounded-lg shadow-md hover:bg-red-200 z-10 text-red-700 font-bold flex items-center gap-1" id="hfa-btn-close">
                        ✖ Close
                    </button>

                    <h4 class="text-center font-bold text-slate-700 mb-2 text-sm title-text">Height-for-Age (Stunting)</h4>
                    <div class="relative w-full aspect-[4/3] md:aspect-auto flex-grow chart-wrapper">
                        <canvas id="whoHfaChart"></canvas>
                    </div>
                </div>

            </div>
        </div>

        <!-- Data Table (කලින් විදිහටමයි) -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider">4. විශ්ලේෂිත දත්ත</h2>
                <span id="record-count" class="bg-blue-100 text-blue-700 text-xs font-extrabold px-3 py-1 rounded-full">0</span>
            </div>
            <div class="overflow-x-auto pb-4">
                <table class="w-full text-sm text-left text-slate-600 min-w-[600px]">
                    <thead class="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-4 py-3 font-bold">No.</th>
                            <th class="px-4 py-3 font-bold">Name</th>
                            <th class="px-4 py-3 font-bold text-center">Age (Mos)</th>
                            <th class="px-4 py-3 font-bold text-center">Height</th>
                            <th class="px-4 py-3 font-bold text-center">Weight</th>
                            <th class="px-4 py-3 font-bold text-center">BMI</th>
                            <th class="px-4 py-3 font-bold text-center">BMI Status</th>
                            <th class="px-4 py-3 font-bold text-center">HFA Status</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="8" class="px-6 py-12 text-center text-slate-400 font-medium">No data available yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let compressedBase64 = "";
        let imageMimeType = "";
        let extractedGlobalData = [];
        let bmiChartInstance = null;
        let hfaChartInstance = null;

        // Fullscreen Toggle Logic
        function toggleFullScreen(containerId, chartInstance) {
            const container = document.getElementById(containerId);
            const expandBtn = container.querySelector('[id$="-expand"]');
            const closeBtn = container.querySelector('[id$="-close"]');
            const wrapper = container.querySelector('.chart-wrapper');
            const isFullscreen = container.classList.contains('fixed');

            if (!isFullscreen) {
                // Go Fullscreen
                container.classList.add('fixed', 'inset-0', 'z-[100]', 'bg-white', 'p-6', 'md:p-12');
                container.classList.remove('relative', 'border', 'border-slate-100', 'rounded-xl');
                expandBtn.classList.add('hidden');
                closeBtn.classList.remove('hidden');
                wrapper.classList.remove('aspect-[4/3]', 'md:aspect-auto');
                wrapper.classList.add('h-[80vh]'); // Give height for fullscreen
            } else {
                // Exit Fullscreen
                container.classList.remove('fixed', 'inset-0', 'z-[100]', 'bg-white', 'p-6', 'md:p-12');
                container.classList.add('relative', 'border', 'border-slate-100', 'rounded-xl');
                expandBtn.classList.remove('hidden');
                closeBtn.classList.add('hidden');
                wrapper.classList.add('aspect-[4/3]', 'md:aspect-auto');
                wrapper.classList.remove('h-[80vh]');
            }
            if (chartInstance) chartInstance.resize(); // Force Chart.js to redraw
        }

        // Image Compression & Processing (කලින් විදිහටමයි)
        function previewAndCompressImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            imageMimeType = file.type;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                document.getElementById('image-preview').src = e.target.result;
                document.getElementById('preview-container').classList.remove('hidden');
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    if (width > 1200) { height *= 1200 / width; width = 1200; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    compressedBase64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                }
            }
        }

        function calculateAgeInMonths(dobStr) {
            if(!dobStr) return null;
            const dob = new Date(dobStr);
            const today = new Date(); 
            let months = (today.getFullYear() - dob.getFullYear()) * 12;
            months -= dob.getMonth();
            months += today.getMonth();
            return months <= 0 ? 0 : months;
        }

        function findClosestAgeData(refObj, ageMonths) {
            if (!refObj || ageMonths === null) return null;
            if (refObj[ageMonths]) return refObj[ageMonths];
            const availableAges = Object.keys(refObj).map(Number);
            if (availableAges.length === 0) return null;
            let closest = null, minDiff = Infinity;
            availableAges.forEach(a => {
                const diff = Math.abs(a - ageMonths);
                if (diff < minDiff) { minDiff = diff; closest = a; }
            });
            return (closest !== null && minDiff <= 2) ? refObj[closest] : null;
        }

        function classifyBMI(bmi, arr) {
            if (!arr) return { label: 'Pending', cls: 'badge-pending' };
            if (bmi < arr[0]) return { label: 'Severe Thinness', cls: 'badge-severe' };
            if (bmi < arr[1]) return { label: 'Thinness', cls: 'badge-danger' };
            if (bmi <= arr[4]) return { label: 'Normal', cls: 'badge-normal' };
            if (bmi <= arr[5]) return { label: 'Overweight', cls: 'badge-warning' };
            return { label: 'Obese', cls: 'badge-severe' };
        }

        function classifyHFA(height, arr) {
            if (!arr) return { label: 'Pending', cls: 'badge-pending' };
            if (height < arr[0]) return { label: 'Severe Stunted', cls: 'badge-severe' };
            if (height < arr[1]) return { label: 'Stunted', cls: 'badge-danger' };
            return { label: 'Normal', cls: 'badge-normal' };
        }

        async function processImageWithGemini() {
            const apiKey = document.getElementById('api-key').value.trim();
            if (!apiKey) { alert("Please enter API Key!"); return; }
            if (!compressedBase64) { alert("Please wait for image compression."); return; }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('analyze-btn').disabled = true;

            const prompt = `Extract all handwritten rows into a valid JSON array of objects. Keys required: "serial_no" (String), "name" (String), "dob" (String: YYYY-MM-DD), "height_cm" (Number), "weight_kg" (Number). Ignore empty rows.`;
            const requestBody = {
                contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/jpeg", data: compressedBase64 } }] }],
                generationConfig: { temperature: 0.1, responseMimeType: "application/json" } 
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody)
                });
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                const data = await response.json();
                let responseText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                extractedGlobalData = JSON.parse(responseText);

                populateTableAndDropdown();
                updateCharts(); 
                document.getElementById('analytics-section').classList.remove('hidden');
            } catch (error) {
                alert("Error: \n" + error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('analyze-btn').disabled = false;
            }
        }

        function populateTableAndDropdown() {
            const tbody = document.getElementById('data-table-body');
            const filterDropdown = document.getElementById('student-filter');
            const gender = document.getElementById('gender').value;
            
            tbody.innerHTML = ""; 
            filterDropdown.innerHTML = '<option value="ALL">📊 සියලුම ළමුන් (All Students)</option>';

            extractedGlobalData.forEach((item, index) => {
                const ageMonths = calculateAgeInMonths(item.dob);
                let bmi = "-";
                let bmiStatus = { label: '-', cls: 'badge-pending' };
                let hfaStatus = { label: '-', cls: 'badge-pending' };
                
                if(item.height_cm && item.weight_kg && ageMonths !== null) {
                    const heightM = item.height_cm / 100;
                    bmi = (item.weight_kg / (heightM * heightM)).toFixed(2);
                    const bmiRef = findClosestAgeData(whoData.bmi[gender], ageMonths);
                    const hfaRef = findClosestAgeData(whoData.hfa[gender], ageMonths);
                    bmiStatus = classifyBMI(parseFloat(bmi), bmiRef);
                    hfaStatus = classifyHFA(parseFloat(item.height_cm), hfaRef);
                    
                    const option = document.createElement('option');
                    option.value = index; 
                    option.textContent = `👤 ${item.serial_no || '*'} - ${item.name}`;
                    filterDropdown.appendChild(option);
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-100 transition-colors";
                tr.innerHTML = `
                    <td class="px-4 py-3 font-semibold text-slate-700">${item.serial_no || '-'}</td>
                    <td class="px-4 py-3 font-medium text-slate-900 whitespace-nowrap">${item.name || '-'}</td>
                    <td class="px-4 py-3 text-center font-bold text-blue-600">${ageMonths !== null ? ageMonths : '-'}</td>
                    <td class="px-4 py-3 text-center">${item.height_cm || '-'}</td>
                    <td class="px-4 py-3 text-center">${item.weight_kg || '-'}</td>
                    <td class="px-4 py-3 text-center font-extrabold text-slate-800">${bmi}</td>
                    <td class="px-4 py-3 text-center"><span class="badge ${bmiStatus.cls}">${bmiStatus.label}</span></td>
                    <td class="px-4 py-3 text-center"><span class="badge ${hfaStatus.cls}">${hfaStatus.label}</span></td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('record-count').innerText = extractedGlobalData.length;
        }

        // 🎨 Colored Band Chart Logic
        function updateCharts() {
            const gender = document.getElementById('gender').value;
            const filterValue = document.getElementById('student-filter').value;
            
            if(bmiChartInstance) bmiChartInstance.destroy();
            if(hfaChartInstance) hfaChartInstance.destroy();

            const bmiWHOData = typeof whoData !== 'undefined' ? whoData.bmi[gender] : null;
            const hfaWHOData = typeof whoData !== 'undefined' ? whoData.hfa[gender] : null;
            if(!bmiWHOData || !hfaWHOData) return;

            const ageKeys = Object.keys(bmiWHOData).sort((a,b) => a-b);
            const bmiLines = { sd3: [], sd2: [], sd1: [], sd0: [], sd1neg: [], sd2neg: [], sd3neg: [] };
            const hfaLines = { sd3: [], sd2: [], sd1: [], sd0: [], sd1neg: [], sd2neg: [], sd3neg: [] };

            ageKeys.forEach(ageKey => {
                const age = Number(ageKey);
                // Extract all 7 parameters from the array: [-3, -2, -1, 0, +1, +2, +3]
                if(bmiWHOData[age]) {
                    bmiLines.sd3neg.push({x: age, y: bmiWHOData[age][0]});
                    bmiLines.sd2neg.push({x: age, y: bmiWHOData[age][1]});
                    bmiLines.sd1neg.push({x: age, y: bmiWHOData[age][2]});
                    bmiLines.sd0.push({x: age, y: bmiWHOData[age][3]});
                    bmiLines.sd1.push({x: age, y: bmiWHOData[age][4]});
                    bmiLines.sd2.push({x: age, y: bmiWHOData[age][5]});
                    bmiLines.sd3.push({x: age, y: bmiWHOData[age][6]});
                }
                if(hfaWHOData[age]) {
                    hfaLines.sd3neg.push({x: age, y: hfaWHOData[age][0]});
                    hfaLines.sd2neg.push({x: age, y: hfaWHOData[age][1]});
                    hfaLines.sd1neg.push({x: age, y: hfaWHOData[age][2]});
                    hfaLines.sd0.push({x: age, y: hfaWHOData[age][3]});
                    hfaLines.sd1.push({x: age, y: hfaWHOData[age][4]});
                    hfaLines.sd2.push({x: age, y: hfaWHOData[age][5]});
                    hfaLines.sd3.push({x: age, y: hfaWHOData[age][6]});
                }
            });

            let studentBmiPoints = [], studentHfaPoints = [];
            extractedGlobalData.forEach((item, index) => {
                if(filterValue !== 'ALL' && index.toString() !== filterValue) return;
                const ageMonths = calculateAgeInMonths(item.dob);
                if(ageMonths !== null && item.weight_kg && item.height_cm) {
                    const heightM = item.height_cm / 100;
                    studentBmiPoints.push({ x: ageMonths, y: parseFloat((item.weight_kg / (heightM * heightM)).toFixed(2)), name: item.name });
                    studentHfaPoints.push({ x: ageMonths, y: parseFloat(item.height_cm), name: item.name });
                }
            });

            const pointSize = filterValue === 'ALL' ? (window.innerWidth < 768 ? 4 : 5) : 10;

            const baseOptions = {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'nearest', intersect: false },
                scales: { x: { type: 'linear', title: { display: true, text: 'Age (Months)' } }, y: { title: { display: true } } },
                plugins: {
                    legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 6, font: { size: 10 } } },
                    tooltip: { callbacks: { label: function(ctx) {
                        if(ctx.dataset.type === 'scatter') return `${ctx.raw.name} (${ctx.raw.y})`;
                        return `${ctx.dataset.label}: ${ctx.raw.y}`;
                    }}}
                }
            };

            // BMI Chart Definition (With Colored Filled Bands)
            const bmiCtx = document.getElementById('whoBmiChart').getContext('2d');
            let bmiOpts = JSON.parse(JSON.stringify(baseOptions));
            bmiOpts.scales.y.title.text = 'BMI (kg/m²)';
            
            bmiChartInstance = new Chart(bmiCtx, {
                data: {
                    datasets: [
                        { type: 'line', label: '+3 SD (Obese)', data: bmiLines.sd3, borderColor: '#ef4444', borderWidth: 1, pointRadius: 0, fill: 1, backgroundColor: 'rgba(239, 68, 68, 0.2)' }, // Red
                        { type: 'line', label: '+2 SD (Overweight)', data: bmiLines.sd2, borderColor: '#f97316', borderWidth: 1, pointRadius: 0, fill: 2, backgroundColor: 'rgba(249, 115, 22, 0.2)' }, // Orange
                        { type: 'line', label: '+1 SD (Normal)', data: bmiLines.sd1, borderColor: '#22c55e', borderWidth: 1, pointRadius: 0, fill: 4, backgroundColor: 'rgba(34, 197, 94, 0.2)' }, // Green (fills to -2SD)
                        { type: 'line', label: 'Median', data: bmiLines.sd0, borderColor: '#166534', borderWidth: 2, borderDash: [5,5], pointRadius: 0, fill: false }, 
                        { type: 'line', label: '-2 SD (Wasting)', data: bmiLines.sd2neg, borderColor: '#f97316', borderWidth: 1, pointRadius: 0, fill: 5, backgroundColor: 'rgba(249, 115, 22, 0.2)' }, // Orange (fills to -3SD)
                        { type: 'line', label: '-3 SD (Severe)', data: bmiLines.sd3neg, borderColor: '#ef4444', borderWidth: 1, pointRadius: 0, fill: 'origin', backgroundColor: 'rgba(239, 68, 68, 0.2)' }, // Red
                        { type: 'scatter', label: 'Students', data: studentBmiPoints, backgroundColor: '#2563eb', borderColor: '#1e3a8a', pointRadius: pointSize, pointHoverRadius: pointSize + 3 }
                    ]
                },
                options: bmiOpts
            });

            // HFA Chart Definition (With Colored Filled Bands)
            const hfaCtx = document.getElementById('whoHfaChart').getContext('2d');
            let hfaOpts = JSON.parse(JSON.stringify(baseOptions));
            hfaOpts.scales.y.title.text = 'Height (cm)';
            
            hfaChartInstance = new Chart(hfaCtx, {
                data: {
                    datasets: [
                        { type: 'line', label: '+3 SD', data: hfaLines.sd3, borderColor: '#3b82f6', borderWidth: 1, pointRadius: 0, fill: 1, backgroundColor: 'rgba(59, 130, 246, 0.1)' },
                        { type: 'line', label: '+2 SD', data: hfaLines.sd2, borderColor: '#22c55e', borderWidth: 1, pointRadius: 0, fill: 4, backgroundColor: 'rgba(34, 197, 94, 0.15)' }, // Green down to -2SD
                        { type: 'line', label: '+1 SD', data: hfaLines.sd1, borderColor: '#22c55e', borderWidth: 0, pointRadius: 0, fill: false, hidden: true },
                        { type: 'line', label: 'Median', data: hfaLines.sd0, borderColor: '#166534', borderWidth: 2, borderDash: [5,5], pointRadius: 0, fill: false }, 
                        { type: 'line', label: '-2 SD (Stunted)', data: hfaLines.sd2neg, borderColor: '#f97316', borderWidth: 1, pointRadius: 0, fill: 5, backgroundColor: 'rgba(249, 115, 22, 0.2)' }, // Orange
                        { type: 'line', label: '-3 SD (Severe)', data: hfaLines.sd3neg, borderColor: '#ef4444', borderWidth: 1, pointRadius: 0, fill: 'origin', backgroundColor: 'rgba(239, 68, 68, 0.2)' }, // Red
                        { type: 'scatter', label: 'Students', data: studentHfaPoints, backgroundColor: '#8b5cf6', borderColor: '#4c1d95', pointRadius: pointSize, pointHoverRadius: pointSize + 3 }
                    ]
                },
                options: hfaOpts
            });
        }
    </script>
